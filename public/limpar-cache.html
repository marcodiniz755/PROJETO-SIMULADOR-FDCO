<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpar Cache - Simulador FDCO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .box {
            background: #f0f8ff;
            border: 2px solid #3498db;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #c0392b;
        }
        .success {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🧹 Limpeza de Cache</h1>
        <p>Clique no botão abaixo para limpar <strong>TODOS</strong> os dados armazenados localmente:</p>
        <ul style="text-align: left; display: inline-block;">
            <li>Cache de parâmetros TFD</li>
            <li>Cache de dados históricos</li>
            <li>Cache de TLP</li>
            <li>Todos os outros dados salvos</li>
        </ul>

        <button onclick="limparTudo()">🗑️ LIMPAR TUDO</button>

        <div id="success" class="success">
            ✅ Cache limpo com sucesso! <br>
            Agora você pode voltar para o simulador.
        </div>

        <hr style="margin: 30px 0;">

        <a href="index.html" style="color: #3498db; text-decoration: none; font-size: 18px;">
            ← Voltar para o Simulador
        </a>
    </div>

    <script>
        function limparTudo() {
            // Limpar localStorage
            localStorage.clear();

            // Limpar sessionStorage
            sessionStorage.clear();

            console.log('✅ Todos os caches foram limpos!');

            // Mostrar mensagem de sucesso
            document.getElementById('success').style.display = 'block';

            // Listar o que foi removido
            console.log('Removido:');
            console.log('- fdco_tfd_cache');
            console.log('- fdco_historical_tfd_cache');
            console.log('- Todos os outros dados locais');
        }

        // Ao carregar, mostrar o que existe no cache
        window.onload = function() {
            console.log('=== CACHE ATUAL ===');
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                console.log(`${key}:`, value.substring(0, 100) + '...');
            }
        };
    </script>
</body>
</html>
